[package]
name = "new_gods_unlimited_interface"
version = "5.0.0"
edition = "2021"
description = "Interface nova do New Gods Unlimited (Tauri), sobre o mesmo motor de simulação."

# Projeto independente: não faz parte de um workspace com o executável antigo.
[workspace]

[[bin]]
name = "new_gods_unlimited_interface"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
macroquad = "0.4"
new_gods_unlimited = { path = ".." }
rayon = "1"

[features]
default = ["custom-protocol"]
# Embute a pasta ui/ no executável (modo de produção do Tauri).
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 4
