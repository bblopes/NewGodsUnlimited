<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Gods Unlimited — protótipo de navegação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1012;--s1:#14171a;--s2:#1a1e22;--s3:#21262b;--s4:#2a3036;
  --bd:#262c32;--bd2:#343b42;--tx:#e6e8ea;--mu:#8e969f;--mu2:#5f6770;
  --ac:#5aa9e6;--acs:rgba(90,169,230,.14);--acb:rgba(90,169,230,.35);
  --wa:#e3b341;--was:rgba(227,179,65,.13);--dg:#e5686b;--dgs:rgba(229,104,107,.14);--ok:#5fbf86;
  --sw:360px;--r:8px;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--mu)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

#app{display:grid;grid-template-rows:52px 1fr 28px;height:100vh}

/* ---------- Barra superior ---------- */
.top{display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;border-bottom:1px solid var(--bd);background:var(--s1);min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.logo{width:22px;height:22px;border-radius:7px;background:radial-gradient(circle at 34% 32%,#9fd3f5 0,#4a95cc 45%,#1d4f75 100%)}
.modesw{display:flex;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:2px;margin-left:6px}
.modesw button{border:0;background:none;padding:4px 10px;border-radius:6px;color:var(--mu);font-weight:500}
.modesw button.on{background:var(--s4);color:var(--tx)}
.vsep{width:1px;height:24px;background:var(--bd)}
.runinfo{display:flex;align-items:center;gap:14px;min-width:0;overflow:hidden;white-space:nowrap}
.kv{display:flex;flex-direction:column;line-height:1.15}
.kv small{color:var(--mu2);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.kv b{font-weight:500;font-size:13px}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;border:1px solid var(--bd2);background:var(--s2);color:var(--tx);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--s3)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#06131d}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--mu)}
.btn.ghost:hover{background:var(--s2);color:var(--tx)}
.btn.icon{width:30px;padding:0}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.warn{background:var(--was);border-color:rgba(227,179,65,.45);color:var(--wa)}
.btn.danger{color:var(--dg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.speed{position:relative}
.speed .btn{min-width:84px;justify-content:space-between}
.menu{position:absolute;top:34px;right:0;background:var(--s2);border:1px solid var(--bd2);border-radius:8px;padding:4px;z-index:40;min-width:140px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:6px 8px;border-radius:5px;text-align:left}
.menu button:hover{background:var(--s3)}
.menu button.on{color:var(--ac)}
.pend{display:flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:500;background:var(--s3);color:var(--mu)}
.pill.wa{background:var(--was);color:var(--wa)}
.pill.ac{background:var(--acs);color:var(--ac)}
.pill.ok{background:rgba(95,191,134,.13);color:var(--ok)}
.pill.dg{background:var(--dgs);color:var(--dg)}

/* ---------- Área principal ---------- */
.main{display:grid;grid-template-columns:1fr auto 56px;min-height:0;position:relative}
.main.collapsed{grid-template-columns:1fr 0 56px}
.stage{position:relative;min-width:0;background:#0b0d0f;overflow:hidden}
#arena{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay-tl{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.overlay-tl .pill{background:rgba(20,23,26,.85);backdrop-filter:blur(6px);border:1px solid var(--bd)}
.overlay-br{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.overlay-br .btn{background:rgba(20,23,26,.88);backdrop-filter:blur(6px)}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px;border-radius:9px;background:rgba(20,23,26,.92);border:1px solid var(--acb);box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:nowrap}
.banner.wa{border-color:rgba(227,179,65,.5)}
.tip{position:absolute;pointer-events:none;background:rgba(20,23,26,.95);border:1px solid var(--bd2);border-radius:7px;padding:6px 8px;font-size:12px;line-height:1.45;display:none;z-index:20;white-space:nowrap}

/* ---------- Lateral ---------- */
.side{width:var(--sw);border-left:1px solid var(--bd);background:var(--s1);display:flex;flex-direction:column;min-height:0;position:relative}
.main.collapsed .side{display:none}
.resizer{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
.resizer:hover,.resizer.drag{background:var(--acb)}
.side-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--bd)}
.side-head h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.side-head .sub{color:var(--mu);font-size:12px}
.side-body{overflow-y:auto;flex:1;padding:4px 0 24px}
.side-body::-webkit-scrollbar{width:10px}
.side-body::-webkit-scrollbar-thumb{background:var(--s4);border-radius:8px;border:3px solid var(--s1)}
.rail{background:var(--s1);border-left:1px solid var(--bd);display:flex;flex-direction:column;align-items:stretch;padding:8px 6px;gap:2px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:8px 0 6px;border-radius:8px;color:var(--mu);font-size:10px;font-weight:500;position:relative}
.rail button svg.i{width:18px;height:18px}
.rail button:hover{background:var(--s2);color:var(--tx)}
.rail button.on{background:var(--acs);color:var(--ac)}
.rail button .dot{position:absolute;top:6px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--wa)}
.rail .sp{flex:1}

/* Seções */
.sec{border-bottom:1px solid var(--bd)}
.sec-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:12px 16px;text-align:left;font-weight:600;font-size:12.5px}
.sec-h:hover{background:var(--s2)}
.sec-h .chev{color:var(--mu2);transition:transform .15s}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .sec-b{display:none}
.sec-h .meta{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400}
.sec-b{padding:2px 16px 14px;display:flex;flex-direction:column;gap:12px}
.hint{color:var(--mu);font-size:12px;line-height:1.45}

/* Campos */
.field{display:flex;flex-direction:column;gap:6px}
.field-top{display:flex;align-items:center;gap:8px}
.field-top label{color:var(--tx);font-size:12.5px}
.field-top .unit{color:var(--mu2);font-size:11.5px}
.field-top .num{margin-left:auto;width:86px;height:26px;border-radius:6px;border:1px solid var(--bd2);background:var(--s2);padding:0 7px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px}
.field-top .num:focus,.txt:focus{outline:none;border-color:var(--ac)}
.field.dirty .field-top label::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--wa);margin-right:6px;vertical-align:1px}
.field.dirty .num{border-color:rgba(227,179,65,.55)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--s4);outline:none;margin:4px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--tx);border:3px solid var(--s1);box-shadow:0 0 0 1px var(--bd2)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--tx);border:3px solid var(--s1)}
.field-foot{display:flex;justify-content:space-between;color:var(--mu2);font-size:11px}
.txt{height:30px;border-radius:7px;border:1px solid var(--bd2);background:var(--s2);padding:0 9px;width:100%}
.row{display:flex;align-items:center;gap:8px}
.row>.txt{flex:1}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.tog input{display:none}
.tog .sw{width:30px;height:18px;border-radius:9px;background:var(--s4);position:relative;flex:none;transition:background .15s}
.tog .sw::after{content:'';position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--mu);transition:all .15s}
.tog input:checked+.sw{background:var(--ac)}
.tog input:checked+.sw::after{left:15px;background:#06131d}
.tog .tl{display:flex;flex-direction:column;white-space:nowrap}
.tog .tl small{color:var(--mu);font-size:11.5px}
.tog.dirty .tl>span::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--wa);margin-right:6px;vertical-align:1px}
.seg{display:flex;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:5px 6px;border-radius:6px;color:var(--mu);font-weight:500;font-size:12px;white-space:nowrap}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--s4);color:var(--tx)}
.seg.dirty{border-color:rgba(227,179,65,.55)}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);background:var(--s2);border-radius:8px;padding:9px 10px;text-align:left;width:100%}
.choice:hover{border-color:var(--bd2)}
.choice.on{border-color:var(--acb);background:var(--acs)}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.choice .rd{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--mu2);margin-top:1px;flex:none}
.choice.on .rd{border:4px solid var(--ac)}
.choice b{font-weight:500;display:block}
.choice small{color:var(--mu);font-size:11.5px;line-height:1.4}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ro{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ro small{color:var(--mu);font-size:11px}
.ro b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro.wide{grid-column:span 2}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:500;background:var(--s3);color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.tag.wa{background:var(--was);color:var(--wa)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.li .meta{display:flex;flex-direction:column;min-width:0;flex:1}
.li .meta b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .meta small{color:var(--mu);font-size:11.5px}
.li.click{cursor:pointer}
.li.click:hover{border-color:var(--bd2)}
.sw-c{width:12px;height:12px;border-radius:4px;flex:none}
.bar{height:6px;border-radius:3px;background:var(--s4);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.cellhead{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.cellhead .who{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.cellhead .who .meta{display:flex;flex-direction:column;min-width:0}
.cellhead .who b{font-weight:600}
.cellhead .who small{color:var(--mu);font-size:11.5px}
.cdot{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.subnav{padding:10px 16px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chartcard{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px 10px 6px}
.chartcard .ct{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.chartcard .ct b{font-weight:500;font-size:12.5px}
.chartcard .ct span{margin-left:auto;color:var(--mu);font-size:11.5px}
.chartcard svg{display:block;width:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.nn text{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:var(--mu)}
.genome{display:grid;grid-template-columns:repeat(64,1fr);gap:1px}
.genome i{aspect-ratio:1;background:var(--s4);border-radius:1px}
.genome i.b{background:var(--ac);opacity:.75}
.genome i.reg{outline:1px solid rgba(227,179,65,.6)}

/* Drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex}
.drawer{margin-left:auto;width:440px;max-width:94vw;height:100%;background:var(--s1);border-left:1px solid var(--bd2);display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drawer-h{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 12px;border-bottom:1px solid var(--bd)}
.drawer-h h3{margin:0 0 3px;font-size:15px;font-weight:600}
.drawer-h p{margin:0;color:var(--mu);font-size:12px;line-height:1.45}
.drawer-b{padding:14px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.drawer-f{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.modal{margin:auto;width:420px;max-width:92vw;background:var(--s1);border:1px solid var(--bd2);border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,.6);animation:pop .15s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}
.modal-b{padding:20px 20px 8px}
.modal-b h3{margin:0 0 8px;font-size:15px;font-weight:600}
.modal-b p{margin:0 0 8px;color:var(--mu);line-height:1.5}
.modal-f{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px}

/* Headless */
.headless{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:30}
.hl-card{width:420px;background:var(--s1);border:1px solid var(--bd2);border-radius:14px;padding:22px}
.hl-card h3{margin:0 0 4px;font-size:16px}
.hl-big{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:18px 0}
.hl-big .ro b{font-size:18px}

/* Demografia em tela cheia */
.demofull{position:absolute;inset:0;background:var(--bg);z-index:25;overflow:auto;padding:18px 20px}
.demofull-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.demofull-h h2{margin:0;font-size:17px;white-space:nowrap}
.demogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.demogrid .kpis{grid-column:span 3;grid-template-columns:repeat(4,1fr)}

/* Laboratório */
.lab{position:absolute;inset:0;overflow:auto;background:var(--bg);z-index:24}
.lab-in{max-width:980px;margin:0 auto;padding:28px 24px 48px}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--mu);margin-bottom:18px}
.crumbs a{color:var(--mu);cursor:pointer;text-decoration:none}
.crumbs a:hover{color:var(--tx)}
.lab h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
.lab .lead{color:var(--mu);margin:0 0 22px;font-size:13.5px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bigcard{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px}
.bigcard:hover{border-color:var(--acb);background:var(--s2)}
.bigcard svg.i{width:22px;height:22px;color:var(--ac)}
.bigcard b{font-size:14.5px;font-weight:600}
.bigcard span{color:var(--mu);line-height:1.5}
.bigcard[disabled]{opacity:.45}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:12px;margin-bottom:14px}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.panel-h b{font-weight:600}
.panel-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.panel-b.one{grid-template-columns:1fr}
.vary{display:grid;grid-template-columns:150px 92px 1fr 1fr;gap:10px;align-items:center}
.vary .txt{height:28px}
.worlds{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.wcard{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.wcard .row{justify-content:space-between}
table.res{width:100%;border-collapse:collapse}
table.res th,table.res td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
table.res th{color:var(--mu);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
table.res tr:hover td{background:var(--s2)}

/* Status */
.status{display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--bd);background:var(--s1);color:var(--mu);font-size:11.5px;white-space:nowrap;overflow:hidden}
.status .msg{color:var(--tx)}
.status .msg.ok{color:var(--ok)}
.status .proto{margin-left:auto;color:var(--mu2)}
.kbd{display:inline-block;padding:0 5px;border:1px solid var(--bd2);border-radius:4px;font-size:10.5px;color:var(--mu);font-family:'JetBrains Mono',monospace}
.empty{padding:28px 16px;text-align:center;color:var(--mu)}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <div class="main" id="main">
    <div class="stage" id="stage">
      <canvas id="arena"></canvas>
      <div class="overlay-tl" id="layerChips"></div>
      <div id="stageBanner"></div>
      <div class="overlay-br" id="camCtl"></div>
      <div class="tip" id="tip"></div>
      <div id="stageOverlay"></div>
    </div>
    <aside class="side" id="side">
      <div class="resizer" id="resizer"></div>
      <div id="sideInner" style="display:flex;flex-direction:column;min-height:0;height:100%"></div>
    </aside>
    <nav class="rail" id="rail"></nav>
  </div>
  <footer class="status" id="status"></footer>
</div>
<div id="layer"></div>

<script>
/* =========================================================================
   Protótipo de navegação — New Gods Unlimited
   Dados fictícios. Cada função render* corresponde a um componente React
   da versão final (TopBar, Rail, SessionTab, EnvironmentTab, MapTab,
   CellsTab, DemographicsTab, LayersTab, ArenaCanvas, Drawer, Modal, Lab*).
   ========================================================================= */

const W = 1600, H = 900, GW = 160, GH = 90;
const $ = s => document.querySelector(s);
const fmt = (n, d = 0) => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const IC = {
  play: '<path d="M7 4.5v15l12-7.5z"/>',
  pause: '<path d="M8 5v14M16 5v14"/>',
  save: '<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',

const groupName = g => ['Grupo azul', 'Grupo verde', 'Grupo âmbar', 'Grupo magenta', 'Grupo violeta', 'Grupo coral', 'Grupo oliva'][g];

const SLOTS = {
  s: ['V<', 'V>', 'V^', 'Vv', 'Cx', 'Cy', 'En', '+1', 'Ct', 'PG', 'PGx', 'PGy', 'P1', 'P1x', 'P1y', 'P2', 'P2x', 'P2y', 'P3', 'P3x', 'P3y', 'Fx', 'Fy', 'PF', 'PFx', 'PFy'],
  i: ['I0', 'I1', 'I2', 'I3', 'I4', 'I5', 'I6', 'I7', 'I8', 'I9', 'I10', 'I11', 'I12', 'I13', 'I14', 'I15', 'T1', 'T2', 'T3'],
  m: ['←', '→', '↑', '↓', 'Rep', 'Fag', 'EG', 'E1', 'E2', 'E3', 'Doar'],
};
const SLOT_DESC = { 'V<': 'Visão · entidade à esquerda', 'V>': 'Visão · entidade à direita', 'V^': 'Visão · entidade acima', 'Vv': 'Visão · entidade abaixo', Cx: 'Corrente no eixo X', Cy: 'Corrente no eixo Y', En: 'Energia relativa', '+1': 'Sinal constante', Ct: 'Contato com outra célula', PG: 'Intensidade de PG', PF: 'Intensidade de PF (fitoplâncton)', Fx: 'Força externa X', Fy: 'Força externa Y', Rep: 'Motor · reproduzir', Fag: 'Motor · fagocitar', EG: 'Motor · reforçar PG', Doar: 'Motor · doar energia' };
function neuralNet(c) {
  const rnd = mulberry(c.seed);
  const rowH = 13, w = 300, hgt = SLOTS.s.length * rowH + 26;
  const pos = {};
  const col = (arr, x, kind) => { const off = 18 + (hgt - 18 - arr.length * rowH) / 2; arr.forEach((n, i) => { pos[kind + i] = [x, off + i * rowH + rowH / 2]; }); };
  col(SLOTS.s, 34, 's'); col(SLOTS.i, 150, 'i'); col(SLOTS.m, 266, 'm');
  const inactive = new Set(); SLOTS.i.forEach((_, i) => { if (rnd() < 0.3) inactive.add('i' + i); });
  const edges = [];
  for (let k = 0; k < c.conns; k++) {
    const toMotor = rnd() < 0.35;
    const a = toMotor && rnd() < 0.5 ? 's' + Math.floor(rnd() * 26) : (rnd() < 0.7 ? 's' + Math.floor(rnd() * 26) : 'i' + Math.floor(rnd() * 19));
    const b = toMotor ? 'm' + Math.floor(rnd() * 11) : 'i' + Math.floor(rnd() * 19);
    if (a === b) continue;
    edges.push([a, b, rnd() * 2 - 1]);
  }
  const node = (k, label, kind) => { const [x, y] = pos[k]; const off = inactive.has(k); const anchor = kind === 's' ? 'end' : kind === 'm' ? 'start' : 'middle'; const tx = kind === 's' ? x - 8 : kind === 'm' ? x + 8 : x; return `<g><title>${label} · ${SLOT_DESC[label] || (kind === 'i' ? 'Neurônio interno' : kind === 'm' ? 'Motor' : 'Sensor')}${off ? ' · inativo geneticamente' : ''}</title><circle data-nn="${off ? '' : k}" cx="${x}" cy="${y}" r="4" fill="${off ? 'var(--s4)' : 'var(--mu)'}" stroke="var(--s1)" stroke-width="1"/>${kind !== 'i' ? `<text x="${tx}" y="${y + 3}" text-anchor="${anchor}">${label}</text>` : ''}</g>`; };
  return `<svg class="nn" viewBox="0 0 ${w} ${hgt}" style="max-height:420px">
    <text x="34" y="9" text-anchor="middle" style="fill:var(--mu2)">sensores</text><text x="150" y="9" text-anchor="middle" style="fill:var(--mu2)">internos</text><text x="266" y="9" text-anchor="middle" style="fill:var(--mu2)">motores</text>
    ${edges.map(([a, b, wt]) => { const [x1, y1] = pos[a], [x2, y2] = pos[b]; return `<path d="M${x1} ${y1} C${(x1 + x2) / 2} ${y1} ${(x1 + x2) / 2} ${y2} ${x2} ${y2}" stroke="${wt > 0 ? 'var(--ok)' : 'var(--dg)'}" stroke-opacity="${0.25 + Math.abs(wt) * 0.5}" stroke-width="${0.6 + Math.abs(wt) * 1.2}" fill="none"/>`; }).join('')}
    ${SLOTS.s.map((n, i) => node('s' + i, n, 's')).join('')}${SLOTS.i.map((n, i) => node('i' + i, n, 'i')).join('')}${SLOTS.m.map((n, i) => node('m' + i, n, 'm')).join('')}
  </svg>`;
}
function genomeGrid(c) {
  const rnd = mulberry(c.seed + 7); let s = '';
  for (let i = 0; i < 64 * 20; i++) s += `<i class="${rnd() < 0.5 ? 'b' : ''} ${i >= 1216 && i < 1251 ? 'reg' : ''}"></i>`;
  return `<div class="genome">${s}</div>`;
}

function genetics() {
  const groups = {}; cells.forEach(c => { groups[c.group] = (groups[c.group] || 0) + 1; });
  const list = Object.entries(groups).sort((a, b) => b[1] - a[1]);
  const n = cells.length || 1;

    return sub + sub2 + `<div class="sec-b" style="padding-top:12px"><div class="hint">Pares origem → destino mais presentes</div><div class="list">${[['PFx', '→', 0.94], ['PFy', '↓', 0.88], ['Ct', 'I0', 0.71], ['PG', 'I0', 0.66], ['I0', 'Doar', 0.52], ['En', 'Rep', 0.47], ['Cx', 'I3', 0.41]].map(([a, b, f]) => `<div class="li"><div class="meta"><b class="mono">${a} → ${b}</b><small>${fmt(f * 100, 1)}% dos cérebros · ${Math.ceil(f * 6)} grupos</small></div><span class="pill ${a === 'Cx' ? 'dg' : 'ok'} mono">peso ${a === 'Cx' ? '−0,63' : '+' + fmt(rand(0.6, 2.4), 2)}</span></div>`).join('')}</div></div>`;
  }
  const dom = list[0];
  return sub + `<div class="sec-b" style="padding-top:12px"><div class="readouts">
    ${ro('População analisada', cells.length)}${ro('Grupos genéticos', list.length)}
    ${ro('Grupo dominante', `${fmt(dom[1] / n * 100, 1)}%`)}${ro('Concordância consenso', '96,8%')}
    ${ro('Coesão do dominante', '99,21%', 'wide')}${ro('Circuito mais recorrente', 'PFx → → · 94%', 'wide')}${ro('Slot mais usado', 'PFx · 81% dos cérebros', 'wide')}
  </div></div>`;
}

function demoKpis() {
  const L = Math.min(WIN_LEN[S.demoWin], SERIES.pop.length), p = SERIES.pop, d = p.at(-1) - p.at(-L);
  return `<div class="kpis">${ro('Células vivas', fmt(p.at(-1)))}${ro('Variação na janela', (d >= 0 ? '+' : '') + fmt(d))}${ro('Gerações', `máx ${fmt(SERIES.gmax.at(-1))} · méd ${fmt(SERIES.gavg.at(-1), 1)}`)}${ro('Diversidade genética', fmt(SERIES.div.at(-1), 1) + '%')}</div>`;
}
function demoCharts(big) {
  const L = Math.min(WIN_LEN[S.demoWin], SERIES.pop.length), sl = a => a.slice(-L);
  const h = big ? 170 : 96;
  const card = (t, right, svg, legend = '') => `<div class="chartcard"><div class="ct"><b>${t}</b><span class="mono">${right}</span></div>${svg}${legend}</div>`;
  const lg = items => `<div class="legend">${items.map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>`;
  return [
    card('População viva', fmt(SERIES.pop.at(-1)) + ' células', lineChart([{ d: sl(SERIES.pop), c: 'var(--ac)' }], { h, L })),
    card('Energia média', fmt(SERIES.energy.at(-1)), lineChart([{ d: sl(SERIES.energy), c: 'var(--ac)' }], { h, L, step: sl(SERIES.minRepro) }), lg([['var(--ac)', 'energia média'], ['var(--wa)', 'mín. reprodução (em vigor)']])),
    card('Idade média', fmt(SERIES.age.at(-1)) + ' ticks', lineChart([{ d: sl(SERIES.age), c: 'var(--ac)' }], { h, L })),
    card('Natalidade', 'eventos / 1k ticks', lineChart([{ d: sl(SERIES.birthN), c: 'var(--ok)' }, { d: sl(SERIES.birthL), c: 'var(--wa)' }], { h, L }), lg([['var(--ok)', 'decisão neural'], ['var(--wa)', 'limite energético']])),
    card('Mortalidade', 'eventos / 1k ticks', lineChart([{ d: sl(SERIES.deathF), c: 'var(--dg)' }, { d: sl(SERIES.deathA), c: 'var(--mu)' }, { d: sl(SERIES.deathP), c: '#b48cf0' }], { h, L }), lg([['var(--dg)', 'fome'], ['var(--mu)', 'idade'], ['#b48cf0', 'fagocitose']])),
    card('Energia atual', 'distribuição', histogram(h)),
  ].join('');
}
function lineChart(series, { h = 96, L, step }) {
  const w = 320, pad = 4, all = series.flatMap(s => s.d).concat(step || []);
  let mn = Math.min(...all), mx = Math.max(...all); if (mx - mn < 1e-6) mx = mn + 1; const span = mx - mn; mn -= span * 0.08; mx += span * 0.08;
  const X = i => pad + i / Math.max(1, L - 1) * (w - pad * 2), Y = v => h - pad - (v - mn) / (mx - mn) * (h - pad * 2);
  const path = d => d.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  const markers = S.events.filter(e => e.idx >= SERIES.pop.length - L).map(e => { const x = X(e.idx - (SERIES.pop.length - L)); return `<line x1="${x}" x2="${x}" y1="0" y2="${h}" stroke="var(--wa)" stroke-dasharray="3 3" stroke-opacity=".7"><title>tick ${fmt(e.tick)} · ${e.label}</title></line><circle cx="${x}" cy="5" r="3" fill="var(--wa)"><title>tick ${fmt(e.tick)} · ${e.label}</title></circle>`; }).join('');
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${w}" y1="${h * f}" y2="${h * f}" stroke="var(--bd)"/>`).join('');
  const stepPath = step ? `<path d="${step.map((v, i) => `${i ? 'H' + X(i).toFixed(1) + 'V' : 'M' + X(i).toFixed(1) + ' '}${Y(v).toFixed(1)}`).join('')}" stroke="var(--wa)" stroke-dasharray="4 3" fill="none" stroke-width="1.2"/>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">${grid}${stepPath}${series.map(s => `<path d="${path(s.d)}" stroke="${s.c}" fill="none" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`).join('')}${markers}</svg>`;
}
function histogram(h) {
  const w = 320, b = 14, cap = S.envApplied.limit, counts = new Array(b).fill(0);
  cells.forEach(c => counts[Math.min(b - 1, Math.floor(c.e / cap * b))]++);
  const m = Math.max(...counts, 1), bw = w / b;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">${counts.map((k, i) => `<rect x="${i * bw + 1}" y="${h - k / m * (h - 6)}" width="${bw - 2}" height="${k / m * (h - 6)}" rx="2" fill="var(--ac)" fill-opacity=".75"><title>${fmt(i * cap / b)}–${fmt((i + 1) * cap / b)}: ${k}</title></rect>`).join('')}</svg>`;
}

/* ------------------------------ Eventos globais ------------------------------ */
document.addEventListener('click', e => {
  if (S.speedMenu && !e.target.closest('.speed')) { S.speedMenu = false; renderTop(); }
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act !== 'closeLayer' && t.closest('[data-stop]') === null && e.target.closest('[data-stop]')) return;
  const fn = ACT[t.dataset.act]; if (fn) fn(t.dataset.v, t, e);
});
document.addEventListener('input', e => {

    const path = t.dataset.f; let v;
    if (t.type === 'checkbox') v = t.checked; else if (t.type === 'text') v = t.value; else { v = parseFloat(t.value); if (isNaN(v)) return; }
    if (path === 'keepAwake') { S.keepAwake = v; return; }

    document.querySelectorAll(`[data-f="${path}"]`).forEach(o => { if (o !== t) { if (o.type === 'checkbox') o.checked = v; else o.value = v; } });
    document.querySelectorAll(`[data-row="${path}"]`).forEach(r => r.classList.toggle('dirty', isDirty(path)));
    if (path === 'env.life') { const el = document.querySelector('[data-live="lifeSun"]'); if (el) el.textContent = fmt(Math.round(v * 1.5)) + ' ticks'; }
    renderTop(); renderRail(); renderStatus();
    const hp = document.querySelector('.side-head .pill.wa'); const ep = envPending().length;
    if (S.tab === 'ambiente') { const h = document.querySelector('.side-head'); const old = h.querySelector('.pill'); if (old) old.remove(); if (ep) h.insertAdjacentHTML('beforeend', `<span class="pill wa">${ep} pendente${ep > 1 ? 's' : ''}</span>`); }
    return;
  }
  if (t.dataset.layer) { S.layers[t.dataset.layer] = t.checked; document.querySelectorAll(`[data-layer="${t.dataset.layer}"]`).forEach(o => o.checked = t.checked); renderStage(); return; }
  if (t.dataset.g === 'brush') { S.brush = +t.value; document.querySelectorAll('[data-g="brush"]').forEach(o => { if (o !== t) o.value = t.value; }); renderStage(); return; }
  if (t.dataset.g === 'replayTick') { S.lab.replayTick = +t.value; const el = document.querySelector('[data-live="rtick"]'); if (el) el.textContent = 'quadro ' + fmt(S.lab.replayTick); return; }
  if (t.dataset.g === 'labWorlds') { S.lab.worlds = clamp(+t.value || 1, 1, 64); return; }

});
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input,textarea,select');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (S.mode !== 'lab') ACT.drawer('runs'); return; }
  if (e.key === 'Escape') {
    if (S.drawer || S.modal) { S.drawer = null; S.modal = null; renderLayer(); return; }
    if (S.headless) { ACT.headlessOff(); return; }
    if (S.insert) { ACT.insert(); return; }
    if (S.mapTool !== 'none') { ACT.tool('none'); return; }
    if (S.demoFull) { ACT.demoFull(); return; }
    if (S.mode === 'lab' && S.lab.view === 'replay') { ACT.lab('results'); return; }
    return;
  }
  if (typing || S.mode === 'lab') return;
  if (e.key === ' ') { e.preventDefault(); ACT.pause(); }
  else if (/^[1-7]$/.test(e.key)) ACT.speed(+e.key - 1);
  else if (e.key === '[') { ACT.cellNav(-1); if (S.tab !== 'celulas') { S.tab = 'celulas'; S.cellsView = 'ind'; renderRail(); renderPanel(); } }
  else if (e.key === ']') { ACT.cellNav(1); if (S.tab !== 'celulas') { S.tab = 'celulas'; S.cellsView = 'ind'; renderRail(); renderPanel(); } }
});

function drawChem(x0, y0, ww, hh) {
  const g = chemCv.getContext('2d'), img = g.createImageData(64, 36), acc = new Float32Array(64 * 36);
  const src = S.layers.chemSel === 'PF' ? food : cells;
  const scale = S.layers.chemSel === 'PF' ? 1 : 3;
  for (const p of src) { const gx = Math.floor(p.x / W * 64), gy = Math.floor(p.y / H * 36); for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { const x = gx + dx, y = gy + dy; if (x >= 0 && y >= 0 && x < 64 && y < 36) acc[y * 64 + x] += scale / (1 + dx * dx + dy * dy); } }
  let m = 0; for (const v of acc) m = Math.max(m, v);
  const hue = { PG: [90, 169, 230], PF: [110, 205, 120] }[S.layers.chemSel] || [190, 140, 240];
  for (let i = 0; i < acc.length; i++) { const v = acc[i] / (m || 1); img.data[i * 4] = hue[0]; img.data[i * 4 + 1] = hue[1]; img.data[i * 4 + 2] = hue[2]; img.data[i * 4 + 3] = Math.floor(v * 120); }
  g.putImageData(img, 0, 0); ctx.imageSmoothingEnabled = true; ctx.drawImage(chemCv, x0, y0, ww, hh);
}
function drawFlow() {
  ctx.fillStyle = 'rgba(160,175,190,.35)';
  for (let y = 50; y < H; y += 80) for (let x = 50; x < W; x += 80) {
    if (isWall(x, y)) continue; const [fx, fy] = flowAt(x, y); const m = Math.hypot(fx, fy); if (m < 0.05) continue;
    const [sx, sy] = toScreen(x, y), a = Math.atan2(fy, fx), L = 9;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(L, 0); ctx.lineTo(-L * 0.6, -L * 0.45); ctx.lineTo(-L * 0.6, L * 0.45); ctx.closePath(); ctx.fill(); ctx.restore();
  }
}
function paint(wx, wy) {
  const gx = Math.floor(wx / 10), gy = Math.floor(wy / 10), r = S.brush;
  for (let y = gy - r; y <= gy + r; y++) for (let x = gx - r; x <= gx + r; x++) {
    if (x < 0 || y < 0 || x >= GW || y >= GH || (x - gx) ** 2 + (y - gy) ** 2 > r * r) continue;
    const i = y * GW + x;
    if (S.mapTool === 'wall') editWall[i] = 1; else if (S.mapTool === 'eraser') { editWall[i] = 0; editSun[i] = 0; } else if (S.mapTool === 'sun') editSun[i] = 1;
  }
  if (!S.mapDirty) { S.mapDirty = true; renderPanel(); renderRail(); renderStage(); }
  buildMapCanvases();
}
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; mouse.inside = true;
  if (mouse.down) {
    if (Math.abs(mouse.x - mouse.sx) + Math.abs(mouse.y - mouse.sy) > 4) mouse.moved = true;
    if (S.tab === 'mapa' && S.mapTool !== 'none' && mouse.btn === 0 && S.mode !== 'lab') { const [wx, wy] = toWorld(mouse.x, mouse.y); paint(wx, wy); }
    else if (mouse.moved) { cam.cx -= e.movementX / view.s; cam.cy -= e.movementY / view.s; S.follow = false; }
  }
});
cv.addEventListener('mouseleave', () => { mouse.inside = false; mouse.down = false; });
cv.addEventListener('mousedown', e => {
  mouse.down = true; mouse.moved = false; mouse.sx = mouse.x; mouse.sy = mouse.y; mouse.btn = e.button;
  if (e.button === 2 && S.insert) { ACT.insert(); return; }
  if (S.tab === 'mapa' && S.mapTool !== 'none' && e.button === 0 && S.mode !== 'lab') { undoStack.push([editWall.slice(), editSun.slice()]); redoStack = []; const [wx, wy] = toWorld(mouse.x, mouse.y); paint(wx, wy); }
});
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mouseup', e => {
  const was = mouse.down && !mouse.moved; mouse.down = false;
  if (!was || e.button !== 0) return;
  const [wx, wy] = toWorld(mouse.x, mouse.y);
  if (S.insert) {
    if (!S.insertOk) { say('Posição inválida: parede, borda ou célula ocupando o espaço'); return; }
    const c = mkCell(wx, wy); c.inserted = true; c.e = 1500; c.gen = 0; cells.push(c); S.selected = c.id; S.insert = false;
    say(`Célula #${c.id} inserida · ${NEURAL.find(n => n.id === S.init.neural).name}`, 'ok'); renderStage(); renderPanel(); renderStatus(); return;
  }
  if (S.tab === 'mapa' && S.mapTool !== 'none') return;
  const h = cellAt(wx, wy);
  if (h) { S.selected = h.id; if (S.mode === 'lab') S.lab.replayTab = 'celulas'; else S.tab = 'celulas'; S.cellsView = 'ind'; S.collapsed = false; renderRail(); renderPanel(); renderStage(); }
});
cv.addEventListener('wheel', e => {
  e.preventDefault(); const [wx, wy] = toWorld(mouse.x, mouse.y);
  cam.zoom = clamp(cam.zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12), 1, 8);
  const d = window.devicePixelRatio || 1, cw = cv.width / d, ch = cv.height / d, fit = Math.min((cw - 48) / W, (ch - 48) / H), s = fit * cam.zoom;
  cam.cx = wx - (mouse.x - cw / 2) / s; cam.cy = wy - (mouse.y - ch / 2) / s;
  if (cam.zoom === 1) { cam.cx = W / 2; cam.cy = H / 2; }
  renderStage();
}, { passive: false });

function countConflicts() { let n = 0; for (let i = 0; i < cells.length; i++) for (let j = i + 1; j < cells.length; j++) { const a = cells[i], b = cells[j], md = (radiusOf(a) + radiusOf(b)) * S.envApplied.acSpace; if ((a.x - b.x) ** 2 + (a.y - b.y) ** 2 < md * md) n++; } return n; }

/* ------------------------------ Laço principal ------------------------------ */
let last = performance.now(), liveT = 0, sampleT = 0, frames = 0, fpsT = 0, fps = 60;
function loop(now) {
  const dt = now - last; last = now; frames++; fpsT += dt;
  if (fpsT > 1000) { fps = Math.round(frames * 1000 / fpsT); frames = 0; fpsT = 0; }
  const running = S.mode === 'sessao' ? !S.paused : (S.lab.view === 'replay' && S.lab.replayPlay);
  if (running) {
    stepWorld();
    if (S.mode === 'sessao') {
      const mult = [1, 10, 100, 1000, 10000, 100000, 1000000][S.speed];
      S.tps = S.headless ? Math.round(1650 + Math.random() * 90) : Math.round(Math.min(mult * 10, 1052) + Math.random() * 20);
      S.tick += Math.round(S.tps * dt / 1000);
    } else { const w = S.lab.results[S.lab.replayWorld]; S.lab.replayTick = Math.min(w.tick, S.lab.replayTick + 400); }
  } else S.tps = 0;
  if (S.mode === 'lab' && S.lab.view === 'running') {
    let changed = false, done = 0;
    S.lab.progress = S.lab.progress.map((p, i) => { const np = Math.min(100, p + S.lab.speeds[i] * dt / 60); if (Math.floor(np) !== Math.floor(p)) changed = true; if (np >= 100) done++; return np; });
    if (changed) S.lab.progress.forEach((p, i) => { const a = document.querySelector(`[data-live="lp${i}"]`), b = document.querySelector(`[data-live="lb${i}"]`); if (a) a.textContent = Math.floor(p) + '%'; if (b) b.style.width = p + '%'; });
    const ld = document.querySelector('[data-live="labDone"]'); if (ld) ld.textContent = `${done} de ${S.lab.progress.length} mundos concluídos`;
    if (done === S.lab.progress.length) { makeResults(S.lab.progress.length); S.lab.view = 'results'; renderAll(); say('Campanha concluída', 'ok'); }
  }
  if (!S.headless && !(S.mode === 'lab' && S.lab.view !== 'replay')) draw();
  liveT += dt; sampleT += dt;
  if (liveT > 250) { liveT = 0; updateLive(); }
  if (sampleT > 2000 && S.mode === 'sessao' && !S.paused) { sampleT = 0; pushSample(); if (S.tab === 'demografia' && !S.collapsed) renderPanel(); if (S.demoFull) renderStage(); }
  requestAnimationFrame(loop);
}
function updateLive() {
  const set = (k, v) => document.querySelectorAll(`[data-live="${k}"]`).forEach(el => el.textContent = v);
  set('tick', fmt(S.tick)); set('cells', cells.length); set('tps', fmt(S.tps)); set('food', food.length); set('fps', fps + ' FPS'); set('pubhz', `pub. ${S.headless ? 0 : Math.min(60, fps - 2)} Hz`); set('pub', `${S.headless ? 0 : Math.min(60, fps - 2)} Hz`);
  set('rtick', 'quadro ' + fmt(S.lab.replayTick));
  if (S.tab === 'ambiente') set('conflicts', countConflicts() + ' pares em conflito');
  const peak = `pico ${fmt(3 + Math.random() * 2, 2)} ppm`; set('peak', peak); set('peak2', peak);
  const c = selectedCell();
  if (c && S.tab === 'celulas') { set('cE', `${fmt(c.e, 1)} / ${fmt(S.envApplied.limit)}`); set('cAge', `${fmt(c.age)} / ${fmt(c.life)}`); set('cKids', c.kids); const b = document.querySelector('[data-live="cEbar"]'); if (b) b.style.width = clamp(c.e / S.envApplied.limit * 100, 0, 100) + '%'; document.querySelectorAll('[data-nn]').forEach(n => { if (!n.dataset.nn) return; const v = Math.random() * 2 - 1; n.setAttribute('fill', v > 0.25 ? 'var(--ok)' : v < -0.25 ? 'var(--dg)' : 'var(--mu)'); n.setAttribute('r', 3 + Math.abs(v) * 2); }); }
}

/* ------------------------------ Início ------------------------------ */
initWorld(); buildMapCanvases(); resize(); renderAll(); requestAnimationFrame(loop);
const _origRenderPanel = renderPanel;
renderPanel = function () { _origRenderPanel(); buildMapCanvases(); };
</script>
