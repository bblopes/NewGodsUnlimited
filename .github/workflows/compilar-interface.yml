# Compila a interface nova (Tauri) para Windows.
#
# A versão mora em "5 - Código-fonte/interface/Cargo.toml" (só números).
# - Em qualquer push na branch interface-nova: compila e guarda o .exe como
#   artefato do workflow, para teste.
# - Na main, quando a versão ainda não tem Release: compila e publica
#   "New Gods Unlimited V<versão>.exe" como pre-release, com as notas de
#   interface/NOTAS_DA_VERSAO.md.
name: Compilar interface nova

on:
  push:
    branches: [main, interface-nova]
    paths:
      - '5 - Código-fonte/**'
      - '.github/workflows/compilar-interface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: '5 - Código-fonte/interface'
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $linha = Get-Content Cargo.toml | Where-Object { $_ -match '^version\s*=\s*"(.+)"' } | Select-Object -First 1
          $null = $linha -match '^version\s*=\s*"(.+)"'
          $v = $Matches[1]
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Versão inválida: $v (use só números, como 2.0.0)" }
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          $existe = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          $naMain = ('${{ github.ref }}' -eq 'refs/heads/main')
          $publicar = $naMain -and -not $existe
          "numero=$v" >> $env:GITHUB_OUTPUT
          "arquivo=New Gods Unlimited V$v.exe" >> $env:GITHUB_OUTPUT
          "publicar=$(if ($publicar) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "compilar=$(if ($naMain -and $existe) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        if: steps.versao.outputs.compilar == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            5 - Código-fonte/interface/target
          key: interface-${{ runner.os }}-${{ hashFiles('5 - Código-fonte/interface/Cargo.toml', '5 - Código-fonte/Cargo.lock') }}
          restore-keys: interface-${{ runner.os }}-

      - name: Rust estável
        if: steps.versao.outputs.compilar == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Compilar
        if: steps.versao.outputs.compilar == 'true'
        run: cargo build --release

      - name: Dar o nome da versão
        if: steps.versao.outputs.compilar == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path ../../saida | Out-Null
          Copy-Item target/release/new_gods_unlimited_interface.exe "../../saida/${{ steps.versao.outputs.arquivo }}"

      - uses: actions/upload-artifact@v4
        if: steps.versao.outputs.compilar == 'true'
        with:
          name: New Gods Unlimited V${{ steps.versao.outputs.numero }}
          path: saida/*.exe

      - name: Publicar na Release
        if: steps.versao.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ steps.versao.outputs.numero }}
          ARQUIVO: ${{ steps.versao.outputs.arquivo }}
        run: |
          gh release create "v$env:NUMERO" "../../saida/$env:ARQUIVO" --repo $env:GITHUB_REPOSITORY --title "New Gods Unlimited V$env:NUMERO — Revamp da interface" --notes-file NOTAS_DA_VERSAO.md --target $env:GITHUB_SHA --prerelease
