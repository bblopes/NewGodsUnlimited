# Mede o desempenho do núcleo da simulação (benchmark headless).
#
# Roda à mão pela aba Actions ou a cada push em branches v3-*, v4-* e v5-*. Compara, NA
# MESMA MÁQUINA, a main (referência) com o código da branch, alternando as
# execuções. As máquinas do GitHub variam muito entre si; só a comparação
# lado a lado é confiável. Também confere se o estado final (hash) é igual.
name: Medir desempenho

on:
  workflow_dispatch:
  push:
    branches: ['v3-**', 'v4-**', 'v5-**']
    paths: ['5 - Código-fonte/src/**', '5 - Código-fonte/Cargo.*', '.github/workflows/medir-desempenho.yml']

jobs:
  medir:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: '5 - Código-fonte'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            5 - Código-fonte/target
          key: bench-${{ hashFiles('5 - Código-fonte/Cargo.lock') }}

      - name: Testes do motor
        run: cargo test --release --lib

      - name: Compilar benchmark (branch)
        run: |
          cargo build --release --bin benchmark_simulacao
          Write-Host "INICIO_LOCK"; git diff -- Cargo.lock; Write-Host "FIM_LOCK"

      - name: Compilar benchmark (main, referência)
        run: |
          $env:CARGO_TARGET_DIR = Join-Path (Get-Location).Path 'target-ref'
          git worktree add ../../referencia origin/main
          Push-Location '../../referencia/5 - Código-fonte'
          cargo build --release --bin benchmark_simulacao
          Pop-Location

      - name: Medir lado a lado
        run: |
          New-Item -ItemType Directory -Force '../4 - Dados/benchmarks' | Out-Null
          $run = (Resolve-Path 'dados-de-teste/populacao-referencia.ecosrun').Path
          $novo = (Resolve-Path './target/release/benchmark_simulacao.exe').Path
          $ref = (Resolve-Path './target-ref/release/benchmark_simulacao.exe').Path
          $casos = @(
            @{ nome = 'realista-100'; args = @('--cenario','realista','--ticks','1000','--aquecimento','200','--repeticoes','1') },
            @{ nome = 'estresse-300'; args = @('--cenario','estresse','--ticks','500','--aquecimento','100','--repeticoes','1') },
            @{ nome = 'sessao-100';   args = @('--cenario','sessao','--populacao','100','--ticks','1000','--aquecimento','15000','--repeticoes','1') },
            @{ nome = 'sessao-200';   args = @('--cenario','sessao','--populacao','200','--ticks','1000','--aquecimento','15000','--repeticoes','1') }
          )
          function Medir($exe, $c, $rotulo, $extra = @()) {
            $log = "../4 - Dados/benchmarks/$($c.nome)-$rotulo.txt"
            & $exe @($c.args + $extra) --run-validado $run --sem-arquivo *>&1 | Tee-Object -FilePath $log | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "benchmark $($c.nome) ($rotulo) falhou" }
            $texto = Get-Content $log -Raw
            $tps = [double]([regex]::Match($texto, 'mediana ([0-9.]+) ticks/s').Groups[1].Value)
            $hash = [regex]::Match($texto, 'estado ([0-9a-f]{16})').Groups[1].Value
            $comp = [regex]::Match($texto, 'comportamento ([0-9a-f]{16})').Groups[1].Value
            return @{ tps = $tps; hash = $hash; comp = $comp }
          }
          # A main já entende --sensores-completos (V3.0.4+)? Então as duas
          # calculam só os sensores lidos e se compara normal × normal. Antes
          # disso, a branch com todos os sensores é que equivale à main.
          $ajudaRef = & $ref --ajuda | Out-String
          $refNova = $ajudaRef -match 'sensores-completos'
          $ajuda = & $novo --ajuda | Out-String
          $completos = if (-not $refNova -and $ajuda -match 'sensores-completos') { @('--sensores-completos') } else { @() }
          $linhas = @('| Caso | main (ticks/s) | branch (ticks/s) | Ganho | Branch: todos os núcleos × 1 thread | Estado igual à main | Comportamento igual |', '|---|---:|---:|---:|---:|---|---|')
          foreach ($c in $casos) {
            # Alterna referência e branch duas vezes e fica com a melhor de cada.
            $r1 = Medir $ref $c 'ref1'; $n1 = Medir $novo $c 'novo1'
            $n2 = Medir $novo $c 'novo2'; $r2 = Medir $ref $c 'ref2'
            $u1 = Medir $novo $c 'novo-1thread' @('--threads','1')
            $r = [math]::Max($r1.tps, $r2.tps); $n = [math]::Max($n1.tps, $n2.tps)
            $par = "$([math]::Round($n / $u1.tps, 2))×"
            if ($refNova) {
              $igual = if ($r1.hash -eq $n1.hash) { 'sim' } else { "NÃO ($($r1.hash) × $($n1.hash))" }
              $comp = if ($r1.comp -eq $n1.comp) { 'sim' } else { 'NÃO' }
            } elseif ($completos.Count -gt 0) {
              # Estado salvo: branch calculando todos os sensores × main.
              # Comportamento: branch normal × branch com todos os sensores.
              $f = Medir $novo $c 'completo' $completos
              $igual = if ($r1.hash -eq $f.hash) { 'sim' } else { "NÃO" }
              $comp = if ($n1.comp -eq $f.comp) { 'sim' } else { 'NÃO' }
            } else {
              $igual = if ($r1.hash -eq $n1.hash) { 'sim' } else { "NÃO ($($r1.hash) × $($n1.hash))" }
              $comp = '—'
            }
            $mesmaThread = if ($u1.hash -eq $n1.hash) { '' } else { ' (1 thread com estado diferente!)' }
            $linhas += "| $($c.nome) | $([math]::Round($r,1)) | $([math]::Round($n,1)) | $([math]::Round($n / $r, 2))× | $par | $igual$mesmaThread | $comp |"
          }
          $tabela = $linhas -join "`n"
          Write-Host "`nCOMPARACAO`n$tabela`nFIM_COMPARACAO"
          "## Main × branch (mesma máquina)`n`n$tabela`n" >> $env:GITHUB_STEP_SUMMARY
